services:
  db:
    image: postgres:18
    container_name: vtb-pg
    environment:
      POSTGRES_USER: ${VTB_PG_USER}
      POSTGRES_PASSWORD: ${VTB_PG_PASSWORD}
      POSTGRES_DB: ${VTB_PG_DB}
      TZ: ${VTB_TZ:-Europe/Berlin}
    # Zeitzone braucht hier BEIDES: `TZ` stellt nur die Container-Uhr, die
    # Server-Zeitzone schreibt Postgres beim `initdb` in postgresql.conf – und die
    # schlägt danach jede Env-Variable. Ein bestehendes Cluster bliebe also auf
    # Etc/UTC, und `CURRENT_DATE` läge zwischen Mitternacht und 02:00 Ortszeit einen
    # Tag zurück (Buchungsdatum, Ein-/Austritts-Statistik, Monatsläufe).
    command:
      - postgres
      - -c
      - timezone=${VTB_TZ:-Europe/Berlin}
      - -c
      - log_timezone=${VTB_TZ:-Europe/Berlin}
    volumes:
      - ./pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VTB_PG_USER} -d ${VTB_PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Protokolle ins Journal statt in eine Container-Datei: Ein `docker compose up -d`
    # erzeugt den Container neu und nimmt sein Log mit — genau dann, wenn man es zum
    # Nachsehen bräuchte (10.09.2026: der Lauf mit den SMTP-Fehlern war nach dem
    # nächsten Deploy weg). Im Journal überleben die Zeilen und rotieren dort
    # zeitgesteuert: `journalctl CONTAINER_NAME=vtb-termin-erinnerung --since "2 days ago"`.
    # `docker logs` funktioniert mit diesem Treiber weiter.
    # Auf Hosts ohne systemd (Docker Desktop) VTB_LOG_DRIVER=json-file setzen.
    logging:
      driver: ${VTB_LOG_DRIVER:-journald}

  vtb-verein:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: vtb-verein:latest
    container_name: vtb-verein
    depends_on:
      db:
        condition: service_healthy

    env_file:
      - .env

    environment:
      VTB_DATABASE_URL: postgresql://${VTB_PG_USER}:${VTB_PG_PASSWORD}@db:5432/${VTB_PG_DB}
      VTB_UPLOAD_PATH: /app/uploads
      # Ohne TZ läuft der Container in UTC – `date.today()` läge dann nachts einen Tag
      # zurück und müsste sich mit CURRENT_DATE der DB streiten. tzdata steckt im
      # python-slim-Image, deshalb genügt die Variable.
      TZ: ${VTB_TZ:-Europe/Berlin}
      # Container-Pfad wie VTB_UPLOAD_PATH darüber: Das Vereinswappen liegt im
      # Image unter /app/branding/vtb und ersetzt die neutrale Wortmarke. Ein
      # anderer Verein trägt hier seinen Pfad ein und hängt das Verzeichnis
      # unten als Volume ein — Pfad und Mount gehören zusammen.
      VTB_BRANDING_PATH: /app/branding/vtb

    ports:
      - "${VTB_PORT:-8000}:8000"

    volumes:
      - ./uploads:/app/uploads

    restart: unless-stopped
    logging:
      driver: ${VTB_LOG_DRIVER:-journald}

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Hintergrund-Sync der Schließanlage (Inventar + IC-Karten + Logs). Eigener Sidecar statt
  # In-Process-Scheduler: kein Worker-Duplikations-Problem, robust über die Restart-Policy.
  # Nutzt dasselbe Image wie vtb-verein (kein zweiter Build). Läuft erst nach dem App-Start
  # (Migrationen), idle wenn kein TTLock-Konto konfiguriert ist.
  #
  # Zwei Takte (#61), beide in der App einstellbar (Schließanlage → Einstellungen): der
  # volle Lauf im Stundentakt, dazwischen nur die Logs im Minutentakt. Alarme (Sabotage,
  # mehrfach falscher Passcode) hängen allein am Log-Sync und sind damit binnen Minuten
  # draußen, während Inventar/IC-Karten/Credentials im ruhigen Takt bleiben — die teuren
  # Cloud-Abfragen werden also NICHT häufiger.
  #
  # Der Container tickt deshalb nur noch stumpf alle TTLOCK_TICK_MINUTES (Default 5) und
  # fragt mit --wenn-faellig in der DB nach, ob etwas dran ist; eine Änderung in der App
  # greift beim nächsten Tick, ohne Neustart. Der Tick ist die Auflösung des Ganzen: Ein
  # Log-Takt kann nie enger wirken als er.
  #
  # Bewusst kein TT-Lock-Callback/Webhook: der bräuchte einen öffentlich erreichbaren
  # HTTPS-Endpunkt (neue Angriffsfläche) und ist pro Developer-App global, also nicht
  # sauber zwischen Dev und Prod trennbar.
  zutritt-sync:
    image: vtb-verein:latest
    container_name: vtb-zutritt-sync
    # Image bringt einen HEALTHCHECK auf den Webserver (Port 8000) mit (backend/Dockerfile).
    # Der Sidecar startet aber nur die Sync-Schleife, keinen Webserver → der vererbte Check
    # würde den Container dauerhaft fälschlich „unhealthy" stempeln. Daher hier abschalten.
    healthcheck:
      disable: true
    depends_on:
      vtb-verein:
        condition: service_healthy
    env_file:
      - .env
    environment:
      VTB_DATABASE_URL: postgresql://${VTB_PG_USER}:${VTB_PG_PASSWORD}@db:5432/${VTB_PG_DB}
      TZ: ${VTB_TZ:-Europe/Berlin}
    command: >
      sh -c '
      T="$${TTLOCK_TICK_MINUTES:-5}";
      [ "$$T" -ge 1 ] 2>/dev/null || T=5;
      echo "[zutritt-sync] gestartet – Tick alle $${T}min, Takt kommt aus der App";
      while true; do
        python tools/zutritt_sync.py --wenn-faellig || echo "[zutritt-sync] Lauf fehlgeschlagen – Retry beim nächsten Tick";
        sleep "$$(( T * 60 ))";
      done'
    restart: unless-stopped
    logging:
      driver: ${VTB_LOG_DRIVER:-journald}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Teamtresor-Beitragslauf (#98): bucht den fälligen Mannschaftsbeitrag je aktivem
  # Kader-Mitglied ohne Befreiung am Monatsersten nach. Idempotent (ein Monat nie
  # doppelt) → ein täglicher Tick genügt, um den 1. sicher zu erwischen. Gleicher
  # Sidecar-Ansatz wie zutritt-sync (kein In-Process-Scheduler, dasselbe Image).
  # Intervall über CLUBDECKEL_BEITRAG_INTERVAL_HOURS (Default 24 = 1×/Tag).
  clubdeckel-beitrag:
    image: vtb-verein:latest
    container_name: vtb-clubdeckel-beitrag
    healthcheck:
      disable: true
    depends_on:
      vtb-verein:
        condition: service_healthy
    env_file:
      - .env
    environment:
      VTB_DATABASE_URL: postgresql://${VTB_PG_USER}:${VTB_PG_PASSWORD}@db:5432/${VTB_PG_DB}
      TZ: ${VTB_TZ:-Europe/Berlin}
    command: >
      sh -c '
      H="$${CLUBDECKEL_BEITRAG_INTERVAL_HOURS:-24}";
      echo "[clubdeckel-beitrag] gestartet – Intervall $${H}h";
      while true; do
        python tools/clubdeckel_beitrag_lauf.py || echo "[clubdeckel-beitrag] Lauf fehlgeschlagen – Retry beim nächsten Intervall";
        sleep "$$(( H * 3600 ))";
      done'
    restart: unless-stopped
    logging:
      driver: ${VTB_LOG_DRIVER:-journald}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Termin-Erinnerungen (#95-Nachgang): erinnert kurz vor einem Termin die, von denen
  # noch keine Meldung vorliegt (Kader + eingeladene Gäste). Anlegen/Ändern/Einladen
  # melden sich schon selbst; hier geht es um die, die es danach vergessen haben.
  # Gleicher Sidecar-Ansatz wie die übrigen Läufe. Intervall über
  # TERMIN_ERINNERUNG_INTERVAL_HOURS (Default 24 = 1×/Tag); den Vorlauf (Vorgabe 3 und
  # 1 Tag) und die Uhrzeit (Vorgabe 7 Uhr, TZ des Containers) stellt der Verein in der
  # App ein (Termine → Erinnerungen). Der Tick ist die Genauigkeit der Uhrzeit.
  termin-erinnerung:
    image: vtb-verein:latest
    container_name: vtb-termin-erinnerung
    healthcheck:
      disable: true
    depends_on:
      vtb-verein:
        condition: service_healthy
    env_file:
      - .env
    environment:
      VTB_DATABASE_URL: postgresql://${VTB_PG_USER}:${VTB_PG_PASSWORD}@db:5432/${VTB_PG_DB}
      TZ: ${VTB_TZ:-Europe/Berlin}
    command: >
      sh -c '
      H="$${TERMIN_ERINNERUNG_INTERVAL_HOURS:-24}";
      T="$${TERMIN_ERINNERUNG_TICK_MINUTES:-30}";
      [ "$$T" -ge 1 ] 2>/dev/null || T=30;
      echo "[termin-erinnerung] gestartet – Intervall $${H}h, Tick $${T}min";
      while true; do
        python tools/termin_erinnerung_lauf.py --wenn-faellig || echo "[termin-erinnerung] Lauf fehlgeschlagen – Retry beim nächsten Tick";
        sleep "$$(( T * 60 ))";
      done'
    restart: unless-stopped
    logging:
      driver: ${VTB_LOG_DRIVER:-journald}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Ticket-Erinnerungen (#179 + Nachgang): mahnt offene Tickets an, die liegen bleiben –
  # weil sie noch KEIN Verantwortlicher geöffnet hat, oder weil seit dem Hinsehen
  # nichts mehr passiert ist. Anlegen/Zuweisen/Kommentieren melden sich schon selbst;
  # hier geht es um das, was danach kommt. Gleicher Sidecar-Ansatz wie die übrigen Läufe.
  # Intervall über TICKET_ERINNERUNG_INTERVAL_HOURS (Default 24 = 1×/Tag); die Fristen
  # je Priorität und die Uhrzeit (Vorgabe 7 Uhr, TZ des Containers) stellt der Verein in
  # der App ein (Tickets → Verwaltung → Erinnerungen).
  ticket-erinnerung:
    image: vtb-verein:latest
    container_name: vtb-ticket-erinnerung
    healthcheck:
      disable: true
    depends_on:
      vtb-verein:
        condition: service_healthy
    env_file:
      - .env
    environment:
      VTB_DATABASE_URL: postgresql://${VTB_PG_USER}:${VTB_PG_PASSWORD}@db:5432/${VTB_PG_DB}
      TZ: ${VTB_TZ:-Europe/Berlin}
    command: >
      sh -c '
      H="$${TICKET_ERINNERUNG_INTERVAL_HOURS:-24}";
      T="$${TICKET_ERINNERUNG_TICK_MINUTES:-30}";
      [ "$$T" -ge 1 ] 2>/dev/null || T=30;
      echo "[ticket-erinnerung] gestartet – Intervall $${H}h, Tick $${T}min";
      while true; do
        python tools/ticket_erinnerung_lauf.py --wenn-faellig || echo "[ticket-erinnerung] Lauf fehlgeschlagen – Retry beim nächsten Tick";
        sleep "$$(( T * 60 ))";
      done'
    restart: unless-stopped
    logging:
      driver: ${VTB_LOG_DRIVER:-journald}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

